name: Build RPM

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  RELEASE: 5.0.0.43

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ aarch64, armv7hl ]

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.arch }}
        id: build
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.RELEASE }}
          arch: ${{ matrix.arch }}

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: RPMS/*.rpm
